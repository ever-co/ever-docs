# Static server for the built Docusaurus site.
#
# This is the stock nginx:alpine default.conf plus two changes: absolute_redirect off, and a
# permanent redirect for the retired locale prefixes.
#
# nginx defaults to absolute_redirect on, so when it issues the trailing-slash redirect for a
# directory it rebuilds a full URL from the Host header and its own listen port. It has no idea TLS
# was terminated upstream by Cloudflare, so it answers with http://. That turned every directory URL
# on docs.ever.co into a three-hop chain with a protocol downgrade in the middle:
#
#     https://docs.ever.co/help   ->  301  http://docs.ever.co/help/     (nginx, downgraded)
#     http://docs.ever.co/help/   ->  301  https://docs.ever.co/help/    (Cloudflare, back up)
#
# Search engines treat redirect chains as a ranking negative and the http hop is a real downgrade.
# With absolute_redirect off nginx emits a relative `Location: /help/`, and the client keeps
# whatever scheme it arrived on -- one hop, no downgrade, no dependence on knowing the public scheme.
#
# Retired locale prefixes. The site used to be built in 13 locales, so search engines know URLs of
# the form /<locale>/<route> (/fr/, /de/docs/intro, ...). The image now builds English only
# (`yarn build --locale en`), so every one of them was a 404 that Google kept re-fetching. Each now
# answers one 301 to the English page:
#
#     /fr  /fr/               ->  /
#     /de/docs/intro          ->  /docs/intro/       (a page directory: straight to its final form)
#     /de/sitemap.xml         ->  /sitemap.xml       (anything else keeps its path as-is)
#
# Only the 12 retired codes, and only as the whole first path segment: /de and /de/... match,
# /design/ or /help/ never do. The redirect only fires for a request that would otherwise 404, so a
# build that emits a locale again (listed in LOCALES in docusaurus.config.ts and built) is served as
# usual instead of being redirected away. The Location is relative (absolute_redirect off), so the
# client stays on https, and the query string is kept.
#
# The rest of the path must start with a character other than / or \ (\x5c). nginx decodes %5C
# before the rewrite, so /de/%5Cevil.com would otherwise answer `Location: /\evil.com`, which
# browsers read as //evil.com -- an open redirect to any host. Such a path stays a plain 404.
# cspell:ignore Cevil
map $uri $retired_locale_rest {
    "~^/(?:ar|bg|de|es|fr|he|it|nl|pl|pt|ru|zh)(/.*)?$"  $1;
}

server {
    listen       80;
    server_name  localhost;

    absolute_redirect off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location ~ ^/(?:ar|bg|de|es|fr|he|it|nl|pl|pt|ru|zh)(?:/|$) {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # A location-level error_page replaces every inherited one, so the 5xx page is repeated.
        error_page   404  =  @retired_locale;
        error_page   500 502 503 504  /50x.html;
    }

    location @retired_locale {
        root   /usr/share/nginx/html;
        if (-d $document_root$retired_locale_rest) {
            rewrite  ^/[^/]+(/[^/\x5c].*?)?/?$  $1/  permanent;
        }
        rewrite  ^/[^/]+(/[^/\x5c].*)$  $1  permanent;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
